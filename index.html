<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vZencowW Profile</title>
    <link rel="stylesheet" href="vZencowW.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>
    <div class="profile-card">
        <img src="avavZencowW.jpg" alt="Avatar" class="avatar">
        <h2>vZencowW</h2>
        <div class="badges">
            <span class="badge developer">Développeur</span>
            <span class="badge vip">VIP</span>
            <span class="badge verified">Vérifié</span>
        </div>
        <p class="quote">Juste du code. Rien d'autre.</p>
        <div class="buttons">
            <a href="https://discord.gg/bdMDnhdF" target="_blank">
                <img src="disc.png" alt="Discord">
            </a>
            <a href="https://open.spotify.com/user/31atb4rwgzssqnomywlxr7glbh3u?si=05e121f972ca4a0e" target="_blank">
                <img src="spotify.png" alt="Telegram">
            </a>
            <a href="https://telegram.org" target="_blank">
                <img src="teleg.png" alt="Site Perso">
            </a>
        </div>
    </div>

    <div class="audio-container">
        <div class="audio-player">
            <button id="play-pause" class="custom-play-pause"></button>
            <div class="time" id="time">0:00 / 0:00</div>
            <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="1">
        </div>
        <audio id="audio" src="Joy Crookes - Feet Dont Fail Me Now (Official Video).mp3" autoplay></audio>
    </div>

    <script src="vZencowW.js"></script>

    <!-- Bouton toggle flèche -->
<div class="toggle-button" id="toggleButton">
    ➤
</div>
